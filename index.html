<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Ticketing System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // CONFIG: PASTE URL GOOGLE APPS SCRIPT KAMU DI SINI
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbxPE8zxVQyo4HvDQDVd2JMWkxseSmXpWg0X5ZH5XygshFTkZMgvAmqndtdj2PVyKYIe/exec";

        // Data Referensi Nilai (Sheet VALUE)
        const REF_BU = ["AND", "LYN", "MAV", "MBS", "MST", "OPI", "PAL"];
        const REF_CATEGORY = ["Hardware", "Network", "Internet", "Oracle", "Odoo", "Harmoni", "Development", "Lain-lain"];
        const REF_PRIORITY = ["High", "Medium", "Low"];
        const REF_PIC = ["Teguh", "Ang Linia", "Bong Susanto", "IT Support"];
        const REF_STATUS = ["Open", "Close", "Pause", "Reassign", "Done"];
        const REF_RANGE = [
            { code: "Range 1", target: "1 Hour", hour: 1 },
            { code: "Range 2", target: "4 Hours", hour: 4 },
            { code: "Range 3", target: "8 Hours", hour: 8 },
            { code: "Range 4", target: "24 Hours", hour: 24 },
            { code: "Range 5", target: "Over 24 Hours", hour: 48 }
        ];

        function App() {
            const [tickets, setTickets] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [view, setView] = React.useState('list'); // 'list' atau 'form'
            const [search, setSearch] = React.useState('');
            const [statusFilter, setStatusFilter] = React.useState('');
            
            // State Form untuk 20 Kolom Excel
            const [formData, setFormData] = React.useState({
                No: '', 'Date and Time IN': '', 'Bussiness Unit': '', User: '', 'Task Name': '',
                'Task Description': '', Category: '', Priority: '', 'Range Code': '', 'Range Target': '',
                'PIC assigned': '', 'Assigned Date and Time': '', 'Start Date and Time': '', 'Target Date and Time': '',
                'Actual Finish Date and Time': '', 'Duration (Hour)': '', 'Target (Hour)': '', 'Score (%)': '',
                'Resolution Description': '', Status: 'Open'
            });

            React.useEffect(() => {
                if(API_URL !== "https://script.google.com/macros/s/AKfycbxPE8zxVQyo4HvDQDVd2JMWkxseSmXpWg0X5ZH5XygshFTkZMgvAmqndtdj2PVyKYIe/exec") {
                    fetchTickets();
                }
            }, []);

            const fetchTickets = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${API_URL}?action=getAll`);
                    const result = await res.json();
                    if (result.status === 'ok') setTickets(result.data);
                } catch (err) {
                    console.error(err);
                }
                setLoading(false);
            };

            const handleRangeChange = (code) => {
                const rangeObj = REF_RANGE.find(r => r.code === code);
                if (rangeObj) {
                    setFormData(prev => {
                        const updated = {
                            ...prev,
                            'Range Code': code,
                            'Range Target': rangeObj.target,
                            'Target (Hour)': rangeObj.hour
                        };
                        return calculateTargetAndMetrics(updated);
                    });
                }
            };

            const handleDateChange = (field, value) => {
                setFormData(prev => {
                    const updated = { ...prev, [field]: value };
                    return calculateTargetAndMetrics(updated);
                });
            };

            const calculateTargetAndMetrics = (data) => {
                let current = { ...data };
                if (current['Assigned Date and Time'] && current['Target (Hour)']) {
                    const assigned = new Date(current['Assigned Date and Time']);
                    assigned.setHours(assigned.getHours() + parseFloat(current['Target (Hour)']));
                    current['Target Date and Time'] = assigned.toISOString().slice(0, 16);
                }
                if (current['Assigned Date and Time'] && current['Actual Finish Date and Time']) {
                    const assigned = new Date(current['Assigned Date and Time']);
                    const finish = new Date(current['Actual Finish Date and Time']);
                    const diffMs = finish - assigned;
                    const diffHours = Math.max(0, (diffMs / (1000 * 60 * 60)).toFixed(2));
                    current['Duration (Hour)'] = diffHours;

                    if (parseFloat(current['Target (Hour)']) > 0) {
                        let score = (parseFloat(current['Target (Hour)']) / parseFloat(diffHours)) * 100;
                        if (parseFloat(diffHours) <= parseFloat(current['Target (Hour)'])) {
                            score = 100; 
                        }
                        current['Score (%)'] = Math.min(100, Math.max(0, score)).toFixed(0);
                    }
                }
                return current;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const finalData = { ...formData, No: formData.No || 'TKT-' + Date.now() };
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'create', data: finalData })
                    });
                    alert("Tiket berhasil dikirim! Silakan cek Google Sheets beberapa saat lagi.");
                    setView('list');
                    setFormData({
                        No: '', 'Date and Time IN': '', 'Bussiness Unit': '', User: '', 'Task Name': '',
                        'Task Description': '', Category: '', Priority: '', 'Range Code': '', 'Range Target': '',
                        'PIC assigned': '', 'Assigned Date and Time': '', 'Start Date and Time': '', 'Target Date and Time': '',
                        'Actual Finish Date and Time': '', 'Duration (Hour)': '', 'Target (Hour)': '', 'Score (%)': '',
                        'Resolution Description': '', Status: 'Open'
                    });
                    setTimeout(fetchTickets, 2000);
                } catch (err) {
                    alert("Error menyimpan tiket!");
                }
                setLoading(false);
            };

            const exportToCSV = () => {
                if (tickets.length === 0) return alert("Belum ada data untuk diekspor!");
                const headers = Object.keys(tickets[0]).filter(k => k !== '_row').join(",");
                const rows = tickets.map(t => Object.keys(t).filter(k => k !== '_row').map(k => `"${t[k]}"`).join(","));
                const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "Laporan_Tiket_IT.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const filteredTickets = tickets.filter(t => {
                const matchSearch = Object.values(t).some(val => String(val).toLowerCase().includes(search.toLowerCase()));
                const matchStatus = statusFilter ? t.Status === statusFilter : true;
                return matchSearch && matchStatus;
            });

            return (
                <div class="container mx-auto p-4 max-w-7xl">
                    <header class="flex flex-col sm:flex-row justify-between items-center bg-white p-6 rounded-xl shadow-sm mb-6 gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-emerald-600">IT Support Ticketing System</h1>
                            <p class="text-sm text-gray-500">Farmasi Operational Dashboard & Logging</p>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto justify-end">
                            <button onClick={() => setView(view === 'list' ? 'form' : 'list')} class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-semibold transition cursor-pointer text-sm">
                                {view === 'list' ? '+ Input Tiket Baru' : 'Lihat Daftar Tiket'}
                            </button>
                            <button onClick={exportToCSV} class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold transition cursor-pointer text-sm">
                                Export CSV
                            </button>
                        </div>
                    </header>

                    {API_URL === "https://script.google.com/macros/s/AKfycbxPE8zxVQyo4HvDQDVd2JMWkxseSmXpWg0X5ZH5XygshFTkZMgvAmqndtdj2PVyKYIe/exec" && (
                        <div class="bg-amber-100 border-l-4 border-amber-500 text-amber-700 p-4 rounded mb-6 text-sm">
                            <strong>Perhatian:</strong> Jangan lupa isi variabel <code class="bg-amber-200 px-1 py-0.5 rounded">API_URL</code> di baris ke-21 dengan tautan Web App milikmu.
                        </div>
                    )}

                    {loading && <div class="text-center font-bold text-emerald-600 my-4 animate-bounce">Menghubungkan ke Google Sheets...</div>}

                    {view === 'list' && (
                        <div class="bg-white p-6 rounded-xl shadow-sm">
                            <div class="flex flex-col sm:flex-row gap-4 justify-between mb-4">
                                <input type="text" placeholder="Cari tiket (User, Komponen, BU...)" value={search} onChange={e => setSearch(e.target.value)} class="border p-2 rounded-lg w-full sm:w-80 outline-emerald-500 text-sm" />
                                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} class="border p-2 rounded-lg outline-emerald-500 text-sm">
                                    <option value="">Semua Status</option>
                                    {REF_STATUS.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-100 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                            <th class="p-3">No</th>
                                            <th class="p-3">Date IN</th>
                                            <th class="p-3">BU</th>
                                            <th class="p-3">User</th>
                                            <th class="p-3">Task Name</th>
                                            <th class="p-3">Priority</th>
                                            <th class="p-3">PIC</th>
                                            <th class="p-3">Score</th>
                                            <th class="p-3">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-sm divide-y divide-gray-100">
                                        {filteredTickets.length === 0 ? (
                                            <tr><td colSpan="9" class="p-8 text-center text-gray-400">Belum ada tiket atau data sedang dimuat.</td></tr>
                                        ) : (
                                            filteredTickets.map((t, idx) => (
                                                <tr key={idx} class="hover:bg-gray-50 transition">
                                                    <td class="p-3 font-medium text-gray-700">{t.No}</td>
                                                    <td class="p-3 whitespace-nowrap">{t['Date and Time IN'] ? t['Date and Time IN'].replace('T', ' ') : '-'}</td>
                                                    <td class="p-3"><span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded font-mono text-xs">{t['Bussiness Unit']}</span></td>
                                                    <td class="p-3 whitespace-nowrap">{t.User}</td>
                                                    <td class="p-3 font-medium text-gray-900">{t['Task Name']}</td>
                                                    <td class="p-3">
                                                        <span class={`px-2 py-0.5 rounded text-xs font-semibold ${t.Priority === 'High' ? 'bg-red-100 text-red-700' : t.Priority === 'Medium' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>
                                                            {t.Priority}
                                                        </span>
                                                    </td>
                                                    <td class="p-3 whitespace-nowrap">{t['PIC assigned']}</td>
                                                    <td class="p-3 font-bold text-emerald-600">{t['Score (%)'] ? t['Score (%)'] + '%' : '-'}</td>
                                                    <td class="p-3">
                                                        <span class={`px-2 py-0.5 rounded text-xs font-bold ${t.Status === 'Done' || t.Status === 'Close' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                                            {t.Status}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {view === 'form' && (
                        <form onSubmit={handleSubmit} class="bg-white p-6 rounded-xl shadow-sm space-y-6">
                            <h2 class="text-lg font-bold text-gray-700 border-b pb-2">Form Input Log Tiket IT Support (20 Kolom Excel)</h2>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Date and Time IN</label>
                                    <input type="datetime-local" required value={formData['Date and Time IN']} onChange={e => handleDateChange('Date and Time IN', e.target.value)} class="w-full border p-2 rounded-lg text-sm outline-emerald-500" />
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Business Unit (BU)</label>
                                    <select required value={formData['Bussiness Unit']} onChange={e => setFormData({...formData, 'Bussiness Unit': e.target.value})} class="w-full border p-2 rounded-lg text-sm outline-emerald-500">
                                        <option value="">Pilih BU</option>
                                        {REF_BU.map(bu => <option key={bu} value={bu}>{bu}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">User Name</label>
                                    <input type="text" required placeholder="Nama User" value={formData.User} onChange={e => setFormData({...formData, User: e.target.value})} class="w-full border p-2 rounded-lg text-sm outline-emerald-500" />
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Status Tiket</label>
                                    <select value={formData.Status} onChange={e => setFormData({...formData, Status: e.target.value})} class="w-full border p-2 rounded-lg text-sm outline-emerald-500">
                                        {REF_STATUS.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Task Name</label>
                                    <input type="text" required placeholder="Judul Masalah/Permintaan" value={formData['Task Name']} onChange={e => setFormData({...formData, 'Task Name': e.target.value})} class="w-full border p-2 rounded-lg text-sm outline-emerald-500" />
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Category</label>
                                    <select required value={formData.Category} onChange={e => setFormData({...formData, Category: e.target.value})} class="w-full border p-2 rounded-lg text-sm outline-emerald-500">
                                        <option value="">Pilih Kategori</option>
                                        {REF_CATEGORY.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                    </select>
                                </div>
                                <div class="md:col-span-2">
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Task Description</label>
                                    <textarea placeholder="Detail kendala..." value={formData['Task Description']} onChange={e => setFormData({...formData, 'Task Description': e.target.value})} class="w-full border p-2 rounded-lg text-sm h-16 outline-emerald-500"></textarea>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 bg-emerald-50 p-4 rounded-xl">
                                <div>
                                    <label class="block text-xs font-bold text-emerald-800 mb-1">Range Code (SLA)</label>
                                    <select required value={formData['Range Code']} onChange={e => handleRangeChange(e.target.value)} class="w-full border bg-white p-2 rounded-lg text-sm outline-emerald-500">
                                        <option value="">Pilih Range</option>
                                        {REF_RANGE.map(r => <option key={r.code} value={r.code}>{r.code}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Range Target</label>
                                    <input type="text" disabled value={formData['Range Target']} class="w-full border bg-gray-100 p-2 rounded-lg text-sm text-gray-500" placeholder="Auto" />
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Target (Hour)</label>
                                    <input type="text" disabled value={formData['Target (Hour)']} class="w-full border bg-gray-100 p-2 rounded-lg text-sm text-gray-500" placeholder="Auto" />
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Priority</label>
                                    <select required value={formData.Priority} onChange={e => setFormData({...formData, Priority: e.target.value})} class="w-full border bg-white p-2 rounded-lg text-sm outline-emerald-500">
                                        <option value="">Pilih Priority</option>
                                        {REF_PRIORITY.map(p => <option key={p} value={p}>{p}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">PIC Assigned</label>
                                    <select required value={formData['PIC assigned']} onChange={e => setFormData({...formData, 'PIC assigned': e.target.value})} class="w-full border p-2 rounded-lg text-sm outline-emerald-500">
                                        <option value="">Pilih PIC</option>
                                        {REF_PIC.map(pic => <option key={pic} value={pic}>{pic}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Assigned Date & Time</label>
                                    <input type="datetime-local" required value={formData['Assigned Date and Time']} onChange={e => handleDateChange('Assigned Date and Time', e.target.value)} class="w-full border p-2 rounded-lg text-sm outline-emerald-500" />
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-1">Start Date & Time</label>
                                    <input type="datetime-local" value={formData['Start Date and Time']} onChange={e => setFormData({...formData, 'Start Date and Time': e.target.value})} class="w-full border p-2 rounded-lg text-sm outline-emerald-500" />
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-red-600 mb-1">Target Date & Time (Auto)</label>
                                    <input type="datetime-local" disabled value={formData['Target Date and Time']} class="w-full border bg-red-50 p-2 rounded-lg text-sm text-red-700" />
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-blue-50 p-4 rounded-xl">
                                <div>
                                    <label class="block text-xs font-medium text-blue-900 mb-1">Actual Finish Date & Time</label>
                                    <input type="datetime-local" value={formData['Actual Finish Date and Time']} onChange={e => handleDateChange('Actual Finish Date and Time', e.target.value)} class="w-full border bg-white p-2 rounded-lg text-sm outline-blue-500" />
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-blue-900 mb-1">Duration (Hour) - Auto</label>
                                    <input type="text" disabled value={formData['Duration (Hour)']} class="w-full border bg-gray-100 p-2 rounded-lg text-sm text-gray-700 font-bold" placeholder="Auto" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-emerald-800 mb-1">KPI Score - Auto</label>
                                    <input type="text" disabled value={formData['Score (%)'] ? formData['Score (%)'] + '%' : ''} class="w-full border bg-gray-100 p-2 rounded-lg text-sm text-emerald-700 font-bold" placeholder="Auto" />
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">Resolution Description</label>
                                <textarea placeholder="Solusi penanganan..." value={formData['Resolution Description']} onChange={e => setFormData({...formData, 'Resolution Description': e.target.value})} class="w-full border p-2 rounded-lg text-sm h-16 outline-emerald-500"></textarea>
                            </div>

                            <div class="flex gap-2 justify-end">
                                <button type="button" onClick={() => setView('list')} class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-6 py-2 rounded-lg font-semibold text-sm cursor-pointer">Batal</button>
                                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-semibold text-sm cursor-pointer shadow-md">Simpan Tiket</button>
                            </div>
                        </form>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
